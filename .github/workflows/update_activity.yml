name: Update Recent Activity

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  # Allow manual trigger
  workflow_dispatch:
  # Run on push to master (optional, to test immediately)
  push:
    branches:
      - master

jobs:
  update-activity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update script
        env:
          # Use a Personal Access Token (PAT) stored in secrets to access private repos
          # If GH_PAT is not set, it falls back to GITHUB_TOKEN (which only sees this repo)
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python scripts/update_activity.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update recent activity stats" && git push)
